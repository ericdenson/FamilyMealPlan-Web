<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Meal Plan - Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin-portal/config.js"></script>
    <script src="admin-portal/supabaseClient.js"></script>

    <style>
        :root {
            --bg-color: #f4f6f8;
            --surface: #ffffff;
            --text-main: #333333;
            --text-muted: #888888;
            --border-light: #e1e4e8;
            --accent-color: #e63946; /* Matching mobile app accent */
            --accent-blue: #4a90e2;
            --danger-color: #e57373;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            display: flex; 
            height: 100vh; 
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at top right, #ffebee 0%, transparent 40%), radial-gradient(circle at bottom left, #eef3fe 0%, transparent 40%);
        }

        .login-card {
            background: var(--surface);
            padding: 48px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--border-light);
            text-align: center;
        }

        .brand-icon {
            font-size: 2.8rem;
            color: var(--accent-color);
            margin-bottom: 16px;
        }

        h2 { margin-bottom: 8px; font-size: 1.6rem; font-weight: 700; color: #1e1e2d; }
        p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 32px; line-height: 1.5; }

        .form-group { text-align: left; margin-bottom: 20px; display: none; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        .form-group input { width: 100%; padding: 14px 16px; border: 1px solid var(--border-light); border-radius: 8px; font-family: inherit; font-size: 1rem; outline: none; transition: border-color 0.2s; background: #fafbfc; }
        .form-group input:focus { border-color: var(--accent-color); background: white; box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.1); }

        .btn { width: 100%; padding: 14px; border-radius: 8px; font-family: inherit; font-size: 1rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: white; background: var(--accent-color); margin-top: 12px; display: none; }
        .btn:hover { background: #d62d3a; box-shadow: 0 4px 12px rgba(230,57,70,0.25); transform: translateY(-1px); }
        .btn:disabled { background: #d0d7de; cursor: not-allowed; transform: none; box-shadow: none; }

        .error-msg { color: var(--danger-color); font-size: 0.85rem; margin-top: 16px; background: #fff5f5; padding: 12px; border-radius: 6px; border: 1px solid #ffcdd2; display: none; text-align: left; }
        .success-msg { color: #2e7d32; font-size: 0.95rem; margin-top: 16px; background: #e8f5e9; padding: 16px; border-radius: 6px; border: 1px solid #c8e6c9; display: none; text-align: center; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="login-card">
        <i class="fa-solid fa-cloud-arrow-up brand-icon" id="header-icon"></i>
        <h2 id="header-title">Analyzing Secure Link...</h2>
        <p id="header-desc">Please wait while we verify your recovery token...</p>

        <form id="reset-form">
            <div id="pwd-box" style="display: none;">
                <div class="form-group" style="display: block; margin-bottom: 12px;">
                    <label>Define a New Password</label>
                    <input type="password" id="new-pass" required placeholder="Minimum 8 Characters...">
                </div>
                <div class="form-group" style="display: block;">
                    <label>Confirm Password</label>
                    <input type="password" id="confirm-pass" required placeholder="Type it again to verify...">
                </div>
            </div>

            <button type="submit" class="btn" id="submit-btn">
                <i class="fa-solid fa-lock"></i> Set New Password
            </button>

            <div id="status-error" class="error-msg">
                <i class="fa-solid fa-circle-exclamation"></i> <span id="error-text">Invalid or expired token.</span>
            </div>
            
            <div id="status-success" class="success-msg">
                <strong><i class="fa-solid fa-circle-check"></i> Password Restored Securely</strong><br><br>
                You may now close this window and log back into the Family Meal Plan app on your mobile device.
            </div>
        </form>
    </div>

    <script>
        const db = window.dbClient; // Instantiated from admin-portal/supabaseClient.js

        const form = document.getElementById('reset-form');
        const btn = document.getElementById('submit-btn');
        const pwdBox = document.getElementById('pwd-box');
        const errBox = document.getElementById('status-error');
        const errText = document.getElementById('error-text');
        const succBox = document.getElementById('status-success');
        
        const hIcon = document.getElementById('header-icon');
        const hTitle = document.getElementById('header-title');
        const hDesc = document.getElementById('header-desc');

        // Supabase password recovery passes the access token in the URL Hash fragment
        // When the page loads, the Supabase JS library automatically parses it into a Session!
        async function verifyRecoveryState() {
            try {
                // Wait 500ms for Supabase library to fully digest the URL Hash into the session storage
                setTimeout(async () => {
                    const { data: { session }, error } = await db.auth.getSession();
                    
                    if (error || !session) {
                        hIcon.className = "fa-solid fa-triangle-exclamation brand-icon";
                        hIcon.style.color = "var(--text-muted)";
                        hTitle.innerText = "Link Expired";
                        hDesc.innerText = "This recovery link is invalid or has already been used. Please request a new one from your mobile app.";
                        return;
                    }

                    // Native Token Verified! Show the Password Form!
                    hIcon.className = "fa-solid fa-key brand-icon";
                    hTitle.innerText = "Create New Password";
                    hDesc.innerText = "Your secure recovery token is verified. Please define a new permanent password below.";
                    
                    pwdBox.style.display = 'block';
                    btn.style.display = 'inline-flex';
                }, 500);
                
            } catch (err) {
                console.error("Verification failed:", err);
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving to Vault...';
            errBox.style.display = 'none';

            const newPassword = document.getElementById('new-pass').value;
            const confirmPassword = document.getElementById('confirm-pass').value;

            try {
                if (newPassword.length < 8) {
                    throw new Error("Your password must be at least 8 characters long.");
                }
                
                if (newPassword !== confirmPassword) {
                    throw new Error("Passwords do not match. Please verify your typing.");
                }

                // 1. Ask Supabase to physically update the user record
                const { data, error } = await db.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                // 2. Clear out the form and display extreme success!
                pwdBox.style.display = 'none';
                btn.style.display = 'none';
                
                hIcon.className = "fa-solid fa-shield-check brand-icon";
                hIcon.style.color = "#2e7d32";
                hTitle.style.display = 'none';
                hDesc.style.display = 'none';

                succBox.style.display = 'block';

                // 3. Immediately log them out on the web browser so they must use mobile
                await db.auth.signOut();

            } catch (err) {
                errText.innerText = err.message;
                errBox.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-lock"></i> Set New Password';
            }
        });

        // Jumpstart!
        verifyRecoveryState();
    </script>
</body>
</html>
